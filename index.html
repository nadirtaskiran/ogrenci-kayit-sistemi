
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Kayıt Sistemi</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1>Öğrenci Kayıt Sistemi</h1>
    <p>Öğrenci kayıt uygulamasına hoş geldiniz.</p>
    
<h2>Öğrenci Ekle</h2>

<form id="studentForm">
    <label for="studentName">Ad Soyad:</label>
    <input type="text" id="studentName" required>

    <label for="studentNumber">Öğrenci Numarası:</label>
    <input type="text" id="studentNumber" required>

    <label for="studentDepartment">Bölüm:</label>
    <input type="text" id="studentDepartment" required>

    <button type="submit">Öğrenci Ekle</button>
</form>


<h2>Öğrenci Listesi</h2>

<table id="studentTable">
    <thead>
        <tr>
            <th>Ad Soyad</th>
            <th>Öğrenci Numarası</th>
            <th>Bölüm</th>
        </tr>
    </thead>
    <tbody id="studentTableBody">
    </tbody>
</table>


<script src="main.js"></script>
</body>
</html>
